# Temporary customer demo setup; uploads on Render's free plan disappear on restart.
services:
  - type: web
    name: lee-tools-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && node dist/prisma/seed.js && node dist/src/index.js
    healthCheckPath: /api/categories
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        sync: false
